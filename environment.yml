name: matryoshka-reasoning
channels:
  - pytorch
  - nvidia
  - huggingface
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Core ML/DL libraries
  - pytorch>=2.0.0
  - pytorch-cuda=12.1
  - transformers>=4.30.0
  - datasets>=2.12.0
  - tokenizers>=0.13.0

  # DeepSpeed and distributed training
  - deepspeed>=0.9.0

  # Data processing
  - numpy>=1.24.0
  - pandas>=2.0.0
  - jsonlines>=3.1.0

  # Utilities
  - fire>=0.5.0
  - tqdm>=4.65.0
  - pathlib

  # Logging and monitoring
  - wandb>=0.15.0

  # Development tools
  - jupyter
  - ipython

  # Additional dependencies via pip
  - pip:
    - accelerate>=0.20.0
    - bitsandbytes>=0.39.0
    - peft>=0.4.0
    - flash-attn>=2.0.0
